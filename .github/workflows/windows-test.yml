name: windows-test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-WinLogs.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-WinLogs.ps1
